<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Bebel</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Fundo mais escuro */
            color: #fff; /* Texto branco para contraste */
        }

        header {
            background-color: #2a2a2a; /* Header um pouco mais claro que o fundo */
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333; /* Linha divisória */
        }

        header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 1px; /* Espaçamento entre letras */
        }

        main {
            padding: 20px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* Tamanho mínimo das colunas */
            grid-gap: 20px;
            justify-items: center; /* Centralizar itens nas células */
        }

        .media-item {
            border-radius: 8px;
            overflow: hidden; /* Para garantir que a borda arredondada funcione */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* Sombra mais forte */
            transition: transform 0.3s ease-in-out; /* Transição suave para o hover */
            background-color: #333; /* Fundo dos itens */
        }

        .media-item:hover {
            transform: scale(1.05); /* Leve aumento no hover */
        }

        .media-item img, .media-item video {
            display: block; /* Remover espaço extra abaixo da imagem/vídeo */
            width: 100%;
            height: auto;
            max-height: 250px; /* Altura máxima um pouco maior */
            object-fit: cover; /* Cobrir o espaço mantendo a proporção */
            cursor: pointer; /* Mãozinha ao passar por cima (para imagens clicáveis) */
        }

        .media-item video {
            max-height: none; /* Remove a restrição de altura para vídeos, se desejar */
        }

        footer {
            background-color: #2a2a2a;
            color: #ddd; /* Cor do texto do footer mais clara */
            padding: 15px;
            text-align: center;
            border-top: 2px solid #333; /* Linha divisória superior */
            font-size: 0.9em;
        }

        /* Estilos para o modal de imagem ampliada */
        .modal {
            display: none; /* Inicialmente escondido */
            position: fixed; /* Fixo na tela */
            z-index: 1; /* Ficar por cima de tudo */
            padding-top: 50px; /* Espaço no topo */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Habilitar scroll se a imagem for muito grande */
            background-color: rgba(0,0,0,0.9); /* Fundo preto semi-transparente */
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80%;
            object-fit: contain; /* Assegura que a imagem inteira seja visível */
        }

        /* Botão de fechar o modal */
        .modal-close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .modal-close:hover,
        .modal-close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        /* Animação de zoom para o modal */
        .modal-content, #caption {
            animation-name: zoom;
            animation-duration: 0.6s;
        }

        @keyframes zoom {
            from {transform:scale(0.1)}
            to {transform:scale(1)}
        }
    </style>
</head>
<body>
    <header>
        <h1>Conteúdo Exclusivo</h1>
    </header>

    <main>
        <div class="media-grid">
            <!-- Conteúdo de mídia será inserido aqui -->
        </div>
    </main>

    <footer>
        <p>Com ❤️ para você.</p>
    </footer>

    <!-- Modal para imagem ampliada -->
    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        const mediaGrid = document.querySelector('.media-grid');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalCloseButton = document.querySelector('.modal-close');

        async function loadMedia() {
            try {
                const response = await fetch('https://api.github.com/repos/Ryssysha/bebelanalvideos/contents/bebelas');
                const files = await response.json();

                for (const file of files) {
                    if (file.type === 'file') {
                        const mediaItem = document.createElement('div');
                        mediaItem.classList.add('media-item');

                        const fileExtension = file.name.split('.').pop().toLowerCase();
                        let mediaElement;

                        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExtension)) {
                            mediaElement = document.createElement('img');
                            mediaElement.src = file.download_url;
                            mediaElement.alt = file.name;
                            mediaElement.onclick = function(){ openModal(this.src); }; // Abrir modal ao clicar na imagem
                        } else if (['mp4', 'webm', 'ogg'].includes(fileExtension)) {
                            mediaElement = document.createElement('video');
                            mediaElement.controls = true; // Adiciona controles de vídeo
                            const source = document.createElement('source');
                            source.src = file.download_url;
                            source.type = `video/${fileExtension}`; // Define o tipo MIME correto
                            mediaElement.appendChild(source);
                        } else {
                            continue; // Ignora arquivos não suportados
                        }

                        mediaItem.appendChild(mediaElement);
                        mediaGrid.appendChild(mediaItem);
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar os arquivos de mídia:', error);
                mediaGrid.innerHTML = '<p>Erro ao carregar o conteúdo.</p>';
            }
        }

        function openModal(imageSrc) {
            modalImage.src = imageSrc;
            imageModal.style.display = "block";
        }

        modalCloseButton.onclick = function() {
            imageModal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == imageModal) {
                imageModal.style.display = "none";
            }
        }

        loadMedia();
    </script>
</body>
</html>
